<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican on a Bicycle</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #87CEEB; /* Sky Blue */
            overflow: hidden;
        }

        svg {
            width: 100%;
            max-width: 600px;
            height: auto;
        }

        /* Background movement (scrolling grass) */
        .ground {
            animation: groundMove 2s linear infinite;
        }

        @keyframes groundMove {
            from { transform: translateX(0); }
            to { transform: translateX(-100px); }
        }

        /* Wheel rotation */
        .wheel {
            transform-origin: center;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Pelican bobbing up and down */
        .pelican-body {
            animation: bob 0.5s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes bob {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Pedaling motion */
        .pedal-arm {
            transform-origin: 230px 320px; /* Pivot point at the crank */
            animation: pedal 1s linear infinite;
        }

        @keyframes pedal {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Wing flapping */
        .wing {
            transform-origin: 180px 200px;
            animation: flap 0.4s ease-in-out infinite alternate;
        }

        @keyframes flap {
            from { transform: rotate(-5deg); }
            to { transform: rotate(15deg); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Elements -->
    <rect x="0" y="350" width="1000" height="50" fill="#2e7d32" /> <!-- Grass -->
    <circle cx="50" cy="50" r="30" fill="white" opacity="0.8" /> <!-- Cloud -->
    <circle cx="80" cy="60" r="40" fill="white" opacity="0.8" />
    <circle cx="40" cy="60" r="30" fill="white" opacity="0.8" />

    <!-- Bicycle Group -->
    <g id="bicycle">
        <!-- Wheels -->
        <g class="wheel" style="transform-box: fill-box;">
            <circle cx="150" cy="330" r="40" stroke="#333" stroke-width="5" fill="none" />
            <line x1="110" y1="330" x2="190" y2="330" stroke="#333" stroke-width="2" />
            <line x1="150" y1="290" x2="150" y2="370" stroke="#333" stroke-width="2" />
        </g>
        <g class="wheel" style="transform-box: fill-box;">
            <circle cx="310" cy="330" r="40" stroke="#333" stroke-width="5" fill="none" />
            <line x1="270" y1="330" x2="350" y2="330" stroke="#333" stroke-width="2" />
            <line x1="310" y1="290" x2="310" y2="370" stroke="#333" stroke-width="2" />
        </g>

        <!-- Frame -->
        <polyline points="150,330 230,330 280,240 180,240 150,330" fill="none" stroke="#e53935" stroke-width="6" />
        <line x1="230" y1="330" x2="280" y2="240" stroke="#e53935" stroke-width="6" /> <!-- Seat post -->
        <line x1="280" y1="240" x2="310" y2="330" stroke="#e53935" stroke-width="6" /> <!-- Front fork -->
        <line x1="280" y1="240" x2="310" y2="220" stroke="#333" stroke-width="5" /> <!-- Handlebar stem -->
        <line x1="290" y1="220" x2="330" y2="220" stroke="#333" stroke-width="5" /> <!-- Handlebars -->

        <!-- Seat -->
        <ellipse cx="275" cy="240" rx="20" ry="7" fill="#333" />

        <!-- Pedals -->
        <g class="pedal-arm">
            <line x1="230" y1="330" x2="230" y2="360" stroke="#555" stroke-width="4" />
            <rect x="215" y="360" width="30" height="8" rx="4" fill="#333" />
        </g>
    </g>

    <!-- Pelican Group -->
    <g class="pelican-body">
        <!-- Body -->
        <ellipse cx="200" cy="200" rx="45" ry="35" fill="white" />
        
        <!-- Wing -->
        <path class="wing" d="M170,200 Q140,180 170,230" fill="none" stroke="white" stroke-width="15" stroke-linecap="round" />

        <!-- Neck -->
        <path d="M235,180 Q260,150 250,100" fill="none" stroke="white" stroke-width="25" stroke-linecap="round" />
        
        <!-- Head -->
        <circle cx="250" cy="90" r="25" fill="white" />
        <circle cx="260" cy="85" r="3" fill="black" /> <!-- Eye -->

        <!-- Beak (Large Pelican Pouch) -->
        <path d="M270,85 L330,100 Q330,140 260,130 Z" fill="#FFB74D" />
        <path d="M270,85 L330,100" stroke="#F57C00" stroke-width="2" fill="none" />
    </g>
</svg>

</body>
</html>
