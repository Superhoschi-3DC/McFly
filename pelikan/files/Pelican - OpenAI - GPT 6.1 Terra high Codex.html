<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #cdeef2;
    font-family: system-ui, sans-serif;
  }
  svg { width: min(100vw, 900px); height: auto; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
  .crank { transform-origin: 362px 335px; animation: spin 1.1s linear infinite; }
  .rider { animation: bob 0.55s ease-in-out infinite alternate; }
  .wing { transform-origin: 369px 225px; animation: flap 0.7s ease-in-out infinite alternate; }
  .cloud { animation: drift 18s linear infinite; }
  .cloud.second { animation-duration: 24s; animation-delay: -12s; }
  .road-mark { animation: road 0.8s linear infinite; }
  .leg-a { animation: pedal-a 1.1s ease-in-out infinite; transform-origin: 360px 270px; }
  .leg-b { animation: pedal-b 1.1s ease-in-out infinite; transform-origin: 355px 270px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { to { transform: translateY(-3px) rotate(-0.5deg); } }
  @keyframes flap { to { transform: rotate(-9deg); } }
  @keyframes drift { from { transform: translateX(860px); } to { transform: translateX(-300px); } }
  @keyframes road { to { transform: translateX(-100px); } }
  @keyframes pedal-a { 50% { transform: rotate(20deg); } }
  @keyframes pedal-b { 50% { transform: rotate(-20deg); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 800 500" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican pedals a red bicycle along a seaside road, with spinning wheels and drifting clouds.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a8dfe9"/>
      <stop offset="1" stop-color="#e7f7eb"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#75cbd0"/>
      <stop offset="1" stop-color="#43a9b8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="675" cy="85" r="38" fill="#ffe69b"/>
  <g fill="#fff" opacity=".8">
    <g class="cloud"><ellipse cx="70" cy="85" rx="52" ry="16"/><circle cx="53" cy="77" r="18"/><circle cx="81" cy="72" r="23"/></g>
    <g class="cloud second"><ellipse cx="70" cy="130" rx="45" ry="14"/><circle cx="55" cy="122" r="17"/><circle cx="82" cy="119" r="20"/></g>
  </g>
  <path d="M0 260 Q100 242 200 260 T400 260 T600 260 T800 260 V360 H0Z" fill="url(#sea)"/>
  <path d="M0 300 Q100 288 200 300 T400 300 T600 300 T800 300" fill="none" stroke="#b9ece9" stroke-width="3" opacity=".7"/>
  <path d="M0 350 Q170 325 330 350 T800 343 V390 H0Z" fill="#e8d6a6"/>
  <rect y="389" width="800" height="111" fill="#536b70"/>
  <rect y="386" width="800" height="6" fill="#f5ecce"/>
  <g class="road-mark" stroke="#e7e1c9" stroke-width="5" stroke-linecap="round" opacity=".75">
    <path d="M-50 455h45 M50 455h45 M150 455h45 M250 455h45 M350 455h45 M450 455h45 M550 455h45 M650 455h45 M750 455h45 M850 455h45"/>
  </g>
  <ellipse cx="390" cy="414" rx="230" ry="13" fill="#354f54" opacity=".18"/>

  <!-- Wheels -->
  <g fill="none" stroke="#263c43">
    <circle cx="245" cy="335" r="70" stroke-width="9"/>
    <circle cx="520" cy="335" r="70" stroke-width="9"/>
  </g>
  <g class="wheel" stroke="#dce9df" stroke-width="2.5">
    <circle cx="245" cy="335" r="61" fill="none"/>
    <path d="M245 274v122 M184 335h122 M202 292l86 86 M288 292l-86 86"/>
    <circle cx="245" cy="335" r="5" fill="#263c43" stroke="none"/>
  </g>
  <g class="wheel" stroke="#dce9df" stroke-width="2.5">
    <circle cx="520" cy="335" r="61" fill="none"/>
    <path d="M520 274v122 M459 335h122 M477 292l86 86 M563 292l-86 86"/>
    <circle cx="520" cy="335" r="5" fill="#263c43" stroke="none"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#dd5d50" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M245 335l75-91 42 91H245l116-91 45 91"/>
    <path d="M362 335l101-94 57 94"/>
    <path d="M463 241l-18-40"/>
  </g>
  <g fill="none" stroke="#344a50" stroke-width="7" stroke-linecap="round">
    <path d="M320 244l-7-21h-25"/>
    <path d="M445 201h32q12 0 12 12"/>
    <path d="M306 220h38"/>
  </g>
  <g class="crank" fill="none" stroke="#354c52" stroke-width="5" stroke-linecap="round">
    <circle cx="362" cy="335" r="18"/>
    <path d="M362 335l18 22m-18-22l-18-22"/>
    <path d="M373 358h17m-56-46h17" stroke-width="6"/>
  </g>

  <!-- Pelican -->
  <g class="rider">
    <g class="leg-b" fill="none" stroke="#e79a54" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M355 270l-14 35 17 24"/>
      <path d="M354 330h22"/>
    </g>
    <path d="M284 222q-25 14-39 5 11 23 39 23Z" fill="#b9d0d0"/>
    <ellipse cx="339" cy="223" rx="67" ry="50" fill="#fffdf2" stroke="#9dbbbb" stroke-width="3"/>
    <path class="wing" d="M309 218q20-31 68-13 7 35-26 45-26 8-42-32Z" fill="#e4eeee" stroke="#9dbbbb" stroke-width="3"/>
    <path d="M385 230q29-11 27-55-2-30 8-48" fill="none" stroke="#9dbbbb" stroke-width="25" stroke-linecap="round"/>
    <path d="M385 229q29-11 27-54-2-30 8-48" fill="none" stroke="#fffdf2" stroke-width="20" stroke-linecap="round"/>
    <circle cx="427" cy="120" r="26" fill="#fffdf2" stroke="#9dbbbb" stroke-width="3"/>
    <path d="M444 124q25 5 75 10-20 14-72 10-14-1-16-9Z" fill="#efa75d" stroke="#ce8243" stroke-width="3" stroke-linejoin="round"/>
    <path d="M445 140q29 6 67-4-14 37-46 35-16-1-21-31Z" fill="#f5c184" stroke="#ce8243" stroke-width="2"/>
    <circle cx="433" cy="114" r="4" fill="#263c43"/>
    <circle cx="434" cy="113" r="1.2" fill="#fff"/>
    <path d="M411 95q18-16 34-2" fill="none" stroke="#fffdf2" stroke-width="6" stroke-linecap="round"/>
    <g class="leg-a" fill="none" stroke="#e79a54" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M360 270l17 32-4 38"/>
      <path d="M371 341h23"/>
    </g>
    <path d="M390 233q27-9 50-26" fill="none" stroke="#d7e6e4" stroke-width="10" stroke-linecap="round"/>
    <path d="M432 208l13-5" stroke="#829fa0" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
