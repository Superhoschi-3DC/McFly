<!DOCTYPE html>
<html>
<head>
    <title>Pelican on a Bicycle</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
        }
    </style>
</head>
<body>
    <svg width="500" height="300" viewBox="0 0 500 300">
        <!-- Background -->
        <rect width="100%" height="100%" fill="#f0f8ff"/>

        <!-- Ground -->
        <rect x="0" y="200" width="500" height="100" fill="#87CEEB"/>

        <!-- Bicycle frame -->
        <path d="M150 200 L200 150 L300 150 L350 200" stroke="#000" stroke-width="3" fill="none"/>

        <!-- Front wheel -->
        <circle cx="170" cy="180" r="25" stroke="#000" stroke-width="2" fill="none"/>
        <circle cx="170" cy="180" r="5" fill="#000"/>
        <!-- Wheel animation -->
        <g>
            <circle cx="170" cy="180" r="20" stroke="#ddd" stroke-width="2" fill="none"/>
            <circle cx="170" cy="180" r="10" fill="#ddd"/>
        </g>
        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 170 180"
            to="360 170 180"
            dur="1s"
            repeatCount="indefinite"
            additive="sum"/>

        <!-- Back wheel -->
        <circle cx="330" cy="180" r="25" stroke="#000" stroke-width="2" fill="none"/>
        <circle cx="330" cy="180" r="5" fill="#000"/>
        <!-- Wheel animation -->
        <g>
            <circle cx="330" cy="180" r="20" stroke="#ddd" stroke-width="2" fill="none"/>
            <circle cx="330" cy="180" r="10" fill="#ddd"/>
        </g>
        <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 330 180"
            to="360 330 180"
            dur="1s"
            repeatCount="indefinite"
            additive="sum"/>

        <!-- Bicycle movement -->
        <animateMotion
            path="M0,0 L100,0"
            dur="4s"
            repeatCount="indefinite"/>

        <!-- Pelican body -->
        <ellipse cx="250" cy="140" rx="35" ry="25" fill="#E6E6FA"/>
        <animate
            attributeName="cx"
            values="250;260;250;240;250"
            dur="1.5s"
            repeatCount="indefinite"/>

        <!-- Pelican head -->
        <ellipse cx="280" cy="130" rx="20" ry="15" fill="#E6E6FA"/>
        <animate
            attributeName="cx"
            values="280;290;280;270;280"
            dur="1.5s"
            repeatCount="indefinite"/>

        <!-- Beak -->
        <path d="M300 130 L320 135 L300 140 Z" fill="#FF6B6B"/>

        <!-- Eye -->
        <circle cx="285" cy="125" r="3" fill="#000"/>

        <!-- Pelican legs -->
        <line x1="250" y1="170" x2="220" y2="190" stroke="#000" stroke-width="2"/>
        <line x1="250" y1="170" x2="230" y2="190" stroke="#000" stroke-width="2"/>
        <animate
            attributeName="x1"
            values="250;260;250;240;250"
            dur="1.5s"
            repeatCount="indefinite"/>
        <line x1="260" y1="170" x2="280" y2="190" stroke="#000" stroke-width="2"/>
        <line x1="260" y1="170" x2="270" y2="190" stroke="#000" stroke-width="2"/>
        <animate
            attributeName="x1"
            values="260;270;260;250;260"
            dur="1.5s"
            repeatCount="indefinite"/>

        <!-- Handlebars -->
        <line x1="220" y1="130" x2="230" y2="110" stroke="#000" stroke-width="2"/>
        <line x1="230" y1="130" x2="240" y2="110" stroke="#000" stroke-width="2"/>
        <line x1="225" y1="110" x2="235" y2="110" stroke="#000" stroke-width="2"/>

        <!-- Bike seat -->
        <rect x="280" y="135" width="20" height="10" rx="5" fill="#FFD700"/>

        <!-- Pouch (for comic effect) -->
        <ellipse cx="260" cy="150" rx="15" ry="10" fill="#E6E6FA"/>
        <animate
            attributeName="cx"
            values="260;270;260;250;260"
            dur="1.5s"
            repeatCount="indefinite"/>
    </svg>
</body>
</html>
