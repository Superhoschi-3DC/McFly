<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Pelican on a Bicycle</title>
<style>
  body{
    margin:0;
    background:#e0f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  svg{
    width:90vw;
    height:auto;
    max-width:800px;
  }
</style>
</head>
<body>

<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">

  <!-- Group that translates across the screen -->
  <g id="ride" transform="translate(-200 200)">
    <!-- Animate the whole ride left‑to‑right -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="-200,200; 800,200"
      keyTimes="0;1"
      dur="10s"
      repeatCount="indefinite"/>
    
    <!-- Bicycle -->
    <g id="bike" stroke="black" stroke-width="3" fill="none">

      <!-- Frame -->
      <path d="M -100,0 L -50,-20 L 0,0 L 50,-20" stroke-linecap="round"/>

      <!-- Front wheel -->
      <g transform="translate(70,20)">
        <circle r="20" fill="#333"/>
        <!-- Wheel spin -->
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="0.5s"
          repeatCount="indefinite"/>
      </g>

      <!-- Rear wheel -->
      <g transform="translate(-70,20)">
        <circle r="20" fill="#333"/>
        <!-- Wheel spin -->
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="0.5s"
          repeatCount="indefinite"/>
      </g>

      <!-- Handlebar -->
      <path d="M -70,-20 L -90,-45" stroke-linecap="round"/>

      <!-- Seat -->
      <path d="M -50,0 L -40,5" stroke-linecap="round"/>

      <!-- Pedal chain (simple) -->
      <line x1="-40" y1="5" x2="-60" y2="25" stroke-width="2"/>

    </g>

    <!-- Pelican -->
    <g id="pelican" fill="white" stroke="black" stroke-width="2" transform="translate(0,-25)">
      
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="15" ry="10"/>

      <!-- Head -->
      <circle cx="-10" cy="-15" r="5"/>

      <!-- Eye -->
      <circle cx="-12" cy="-17" r="1" fill="black"/>

      <!-- Beak -->
      <polygon points="-5,-15 -15,-10 -10,-5" fill="orange"/>

      <!-- Wing (flaps) -->
      <g id="wing" transform="rotate(0 0 0)">
        <path d="M -5,0 Q -15,10 -5,20" stroke-linecap="round"/>
        <!-- Wing flapping -->
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 0 0; 15 0 0; 0 0 0"
          keyTimes="0;0.5;1"
          dur="2s"
          repeatCount="indefinite"/>
      </g>

      <!-- Tail -->
      <polygon points="10,5 15,0 10,-5" fill="#eee"/>

      <!-- Tail feathers -->
      <path d="M 10,5 L 20,0" stroke-linecap="round"/>

    </g>
  </g>
</svg>

</body>
</html>
