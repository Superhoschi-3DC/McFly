<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pelican Riding a Bicycle</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e2a3a;
  }
  svg {
    width: min(90vw, 720px);
    height: auto;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee7ff"/>
      <stop offset="1" stop-color="#e8f9ff"/>
    </linearGradient>
  </defs>

  <!-- Sky & ground -->
  <rect width="600" height="420" fill="url(#sky)"/>
  <rect y="355" width="600" height="65" fill="#8bc34a"/>
  <line x1="0" y1="355" x2="600" y2="355" stroke="#6ea83a" stroke-width="4"/>

  <!-- Scrolling road dashes -->
  <line x1="0" y1="368" x2="600" y2="368" stroke="#fff" stroke-width="4" stroke-dasharray="34 26">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- Drifting cloud -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="120" cy="70" rx="45" ry="18"/>
      <ellipse cx="155" cy="60" rx="35" ry="16"/>
      <animateTransform attributeName="transform" type="translate" from="120 0" to="-320 0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="420" cy="40" rx="38" ry="15"/>
      <ellipse cx="450" cy="32" rx="28" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="120 0" to="-700 0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Motion lines -->
  <g stroke="#9adcf0" stroke-width="5" stroke-linecap="round">
    <line x1="40" y1="270" x2="105" y2="270">
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="60;20;60" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="25" y1="305" x2="95" y2="305">
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="0.25s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="55;15;55" dur="0.7s" begin="0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="45" y1="335" x2="100" y2="335">
      <animate attributeName="opacity" values="0;1;0" dur="0.7s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="65;25;65" dur="0.7s" begin="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= BICYCLE ================= -->
  <g>
    <!-- Wheels -->
    <g>
      <circle cx="160" cy="300" r="55" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <g>
        <line x1="160" y1="250" x2="160" y2="350" stroke="#444" stroke-width="4"/>
        <line x1="110" y1="300" x2="210" y2="300" stroke="#444" stroke-width="4"/>
        <line x1="125" y1="265" x2="195" y2="335" stroke="#444" stroke-width="4"/>
        <line x1="195" y1="265" x2="125" y2="335" stroke="#444" stroke-width="4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 160 300" to="360 160 300" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle cx="160" cy="300" r="7" fill="#2b2b2b"/>
    </g>
    <g>
      <circle cx="390" cy="300" r="55" fill="none" stroke="#2b2b2b" stroke-width="7"/>
      <g>
        <line x1="390" y1="250" x2="390" y2="350" stroke="#444" stroke-width="4"/>
        <line x1="340" y1="300" x2="440" y2="300" stroke="#444" stroke-width="4"/>
        <line x1="355" y1="265" x2="425" y2="335" stroke="#444" stroke-width="4"/>
        <line x1="425" y1="265" x2="355" y2="335" stroke="#444" stroke-width="4"/>
        <animateTransform attributeName="transform" type="rotate" from="0 390 300" to="360 390 300" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle cx="390" cy="300" r="7" fill="#2b2b2b"/>
    </g>

    <!-- Frame -->
    <g stroke="#e53935" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="160" y1="300" x2="275" y2="300"/>  <!-- chainstay -->
      <line x1="160" y1="300" x2="200" y2="218"/>  <!-- seat stay -->
      <line x1="200" y1="218" x2="275" y2="300"/>  <!-- seat tube -->
      <line x1="200" y1="220" x2="418" y2="222"/>  <!-- top tube -->
      <line x1="275" y1="300" x2="418" y2="222"/>  <!-- down tube -->
      <line x1="418" y1="222" x2="390" y2="300"/>  <!-- fork -->
      <line x1="200" y1="218" x2="196" y2="200"/>  <!-- seat post -->
      <line x1="418" y1="222" x2="430" y2="195"/>  <!-- handlebar stem -->
    </g>
    <rect x="176" y="194" width="44" height="10" rx="5" fill="#333"/>          <!-- saddle -->
    <path d="M430,195 q14,-10 26,-4" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/> <!-- handlebar -->

    <!-- Crank + pedals -->
    <g>
      <line x1="275" y1="300" x2="275" y2="324" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <rect x="264" y="320" width="22" height="7" rx="3" fill="#333"/>
      <line x1="275" y1="300" x2="275" y2="276" stroke="#555" stroke-width="7" stroke-linecap="round"/>
      <rect x="264" y="273" width="22" height="7" rx="3" fill="#333"/>
      <animateTransform attributeName="transform" type="rotate" from="0 275 300" to="360 275 300" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <circle cx="275" cy="300" r="9" fill="#777"/>
  </g>

  <!-- ================= PELICAN ================= -->
  <g>
    <!-- gentle bob -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- Far leg (behind body) -->
    <g>
      <path d="M222,172 Q250,220 264,286 L282,288" fill="none" stroke="#d67d1e" stroke-width="11" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="24 222 172; -24 222 172; 24 222 172" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </g>

    <!-- Tail -->
    <path d="M158,148 l-26,-8 4,14 -10,10 22,2 z" fill="#f2f2f2" stroke="#d8d8d8" stroke-width="2" stroke-linejoin="round"/>

    <!-- Body -->
    <ellipse cx="215" cy="145" rx="60" ry="40" fill="#ffffff" stroke="#d8d8d8" stroke-width="3"/>

    <!-- Wing -->
    <path d="M185,140 q30,-16 62,4 q-8,34 -46,34 q-24,-2 -16,-38 z" fill="#f0f0f0" stroke="#d8d8d8" stroke-width="2"/>

    <!-- Neck -->
    <path d="M258,140 C 292,138 292,108 300,92" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <path d="M258,140 C 292,138 292,108 300,92" fill="none" stroke="#d8d8d8" stroke-width="22" stroke-linecap="round" opacity="0.25"/>

    <!-- Head -->
    <circle cx="303" cy="85" r="17" fill="#ffffff" stroke="#d8d8d8" stroke-width="3"/>

    <!-- Beak + pouch -->
    <path d="M312,78 L382,86 L312,92 Z" fill="#f5941e"/>
    <path d="M314,92 Q 340,112 378,88 Q 348,100 314,92 Z" fill="#e8871e"/>
    <line x1="314" y1="85" x2="378" y2="86" stroke="#c96f0e" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="303" cy="80" r="3" fill="#222"/>

    <!-- Near leg (in front) -->
    <g>
      <path d="M218,178 Q 248,226 268,292 L288,294" fill="none" stroke="#f5941e" stroke-width="12" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" values="-24 218 178; 24 218 178; -24 218 178" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
    </g>
  </g>
</svg>

</body>
</html>
