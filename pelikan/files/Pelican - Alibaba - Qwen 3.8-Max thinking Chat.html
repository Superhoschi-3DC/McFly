<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Riding a Bicycle — Animated SVG</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(1200px 800px at 50% -10%, #24405e, #101822 60%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #eaf2f8;
  }
  h1 { margin: 0; font-size: clamp(1.1rem, 3vw, 1.7rem); font-weight: 600; }
  h1 span { opacity: .6; font-weight: 400; }
  .frame {
    width: min(94vw, 920px); border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
  }
  svg { display: block; width: 100%; height: auto; }
  footer { font-size: .8rem; opacity: .55; }
</style>
</head>
<body>

<h1>🚲 Pelican on a Bicycle <span>· pure SVG + SMIL</span></h1>

<div class="frame">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An animated pelican riding a bicycle through a sunny landscape">
  <title>Pelican riding a bicycle</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FBEF3"/>
      <stop offset="0.55" stop-color="#A8DCF6"/>
      <stop offset="1" stop-color="#E3F4FD"/>
    </linearGradient>

    <!-- wheel, centered on (0,0) -->
    <g id="wheel">
      <circle r="54" fill="none" stroke="#2B3A42" stroke-width="10"/>
      <circle r="45" fill="none" stroke="#B0BEC5" stroke-width="4"/>
      <g stroke="#CFD8DC" stroke-width="2.5">
        <line y1="-45" y2="45"/>
        <line x1="-45" x2="45"/>
        <line x1="-31.8" y1="-31.8" x2="31.8" y2="31.8"/>
        <line x1="-31.8" y1="31.8" x2="31.8" y2="-31.8"/>
      </g>
      <circle cy="-38" r="3.5" fill="#FFB300"/>
      <circle r="6.5" fill="#78909C" stroke="#546E7A" stroke-width="1.5"/>
    </g>

    <!-- cloud, centered on (0,0) -->
    <g id="cloud" fill="#ffffff" opacity="0.92">
      <ellipse rx="44" ry="17"/>
      <ellipse cx="-28" cy="6" rx="28" ry="13"/>
      <ellipse cx="26" cy="6" rx="32" ry="14"/>
      <ellipse cx="-4" cy="-12" rx="24" ry="15"/>
      <ellipse cx="20" cy="-8" rx="18" ry="12"/>
    </g>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- ===== SUN ===== -->
  <circle cx="680" cy="85" r="48" fill="#FFD54F" opacity="0.25">
    <animate attributeName="r" values="46;54;46" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;0.15;0.25" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#FFD54F" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 680 85;360 680 85" dur="50s" repeatCount="indefinite"/>
    <line x1="680" y1="43" x2="680" y2="29"/>
    <line x1="709.7" y1="55.3" x2="719.6" y2="45.4"/>
    <line x1="722" y1="85" x2="736" y2="85"/>
    <line x1="709.7" y1="114.7" x2="719.6" y2="124.6"/>
    <line x1="680" y1="127" x2="680" y2="141"/>
    <line x1="650.3" y1="114.7" x2="640.4" y2="124.6"/>
    <line x1="638" y1="85" x2="624" y2="85"/>
    <line x1="650.3" y1="55.3" x2="640.4" y2="45.4"/>
  </g>
  <circle cx="680" cy="85" r="34" fill="#FFDE59"/>

  <!-- ===== CLOUDS (parallax drift) ===== -->
  <g><animateTransform attributeName="transform" type="translate" values="920 0;-280 0" dur="34s" begin="-6s" repeatCount="indefinite"/>
    <g transform="translate(0,84) scale(1.15)"><use href="#cloud"/></g></g>
  <g><animateTransform attributeName="transform" type="translate" values="920 0;-280 0" dur="46s" begin="-22s" repeatCount="indefinite"/>
    <g transform="translate(0,152) scale(0.8)"><use href="#cloud"/></g></g>
  <g><animateTransform attributeName="transform" type="translate" values="920 0;-280 0" dur="28s" begin="-12s" repeatCount="indefinite"/>
    <g transform="translate(0,52) scale(0.6)"><use href="#cloud"/></g></g>

  <!-- ===== BIRDS ===== -->
  <g stroke="#3E5C76" stroke-width="2.5" fill="none" stroke-linecap="round">
    <animateMotion path="M 880 92 Q 620 58 400 92 Q 180 126 -80 88" dur="26s" repeatCount="indefinite"/>
    <path d="M -20 0 q 6 -7 12 0 q 6 -7 12 0"/>
    <path d="M 8 -18 q 5 -6 10 0 q 5 -6 10 0"/>
    <path d="M 26 4 q 4 -5 8 0 q 4 -5 8 0"/>
  </g>

  <!-- ===== HILLS (parallax, seamless 800px loops) ===== -->
  <g><animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="45s" repeatCount="indefinite"/>
    <path fill="#A3C585" d="M -800 416 Q -700 340 -600 416 Q -500 360 -400 416 Q -300 330 -200 416 Q -100 370 0 416
      Q 100 340 200 416 Q 300 360 400 416 Q 500 330 600 416 Q 700 370 800 416
      Q 900 340 1000 416 Q 1100 360 1200 416 Q 1300 330 1400 416 Q 1500 370 1600 416 Z"/>
  </g>
  <g><animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="20s" repeatCount="indefinite"/>
    <path fill="#7DAF5B" d="M -800 416 Q -700 360 -600 416 Q -500 385 -400 416 Q -300 350 -200 416 Q -100 395 0 416
      Q 100 360 200 416 Q 300 385 400 416 Q 500 350 600 416 Q 700 395 800 416
      Q 900 360 1000 416 Q 1100 385 1200 416 Q 1300 350 1400 416 Q 1500 395 1600 416 Z"/>
  </g>

  <!-- ===== GRASS + ROAD ===== -->
  <rect x="0" y="416" width="800" height="9" fill="#689F38"/>
  <rect x="0" y="416" width="800" height="3" fill="#8BC34A"/>
  <rect x="0" y="424" width="800" height="76" fill="#5B6770"/>
  <rect x="0" y="424" width="800" height="4" fill="#4A555E"/>
  <line x1="-60" y1="468" x2="1740" y2="468" stroke="#EDF1F4" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="54 38" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;92" dur="0.41s" repeatCount="indefinite"/>
  </line>

  <!-- ===== WIND STREAKS ===== -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="120" y1="252" x2="180" y2="252" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="30 0;-70 0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="100" y1="296" x2="165" y2="296" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="30 0;-70 0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="340" x2="185" y2="340" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="30 0;-70 0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== SHADOWS ===== -->
  <ellipse cx="360" cy="428" rx="185" ry="8" fill="#000" opacity="0.15"/>
  <ellipse cx="250" cy="425" rx="26" ry="4" fill="#000" opacity="0.25"/>
  <ellipse cx="470" cy="425" rx="26" ry="4" fill="#000" opacity="0.25"/>

  <!-- ===== RIDER + BIKE (bobs twice per pedal stroke) ===== -->
  <g id="rider">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.4;0 0"
      dur="1s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>

    <!-- far-side crank arm + pedal (pedal counter-rotates to stay level) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 355 370;360 355 370" dur="2s" repeatCount="indefinite"/>
      <line x1="355" y1="370" x2="333" y2="370" stroke="#757575" stroke-width="6" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 333 370;-360 333 370" dur="2s" repeatCount="indefinite"/>
        <rect x="322" y="366" width="22" height="8" rx="3" fill="#455A64"/>
      </g>
    </g>

    <!-- far leg (pedaling, 8 keyframed poses per revolution) -->
    <path fill="none" stroke="#F57C00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"
          d="M340 265 L380 320 L333 370">
      <animate attributeName="d" dur="2s" repeatCount="indefinite"
        values="M340 265 L380 320 L333 370;M340 265 L391 310 L339 354;M340 265 L400 297 L355 348;M340 265 L402 293 L371 354;M340 265 L395 304 L377 370;M340 265 L382 319 L371 386;M340 265 L370 326 L355 392;M340 265 L371 325 L339 386;M340 265 L380 320 L333 370"/>
    </path>
    <!-- far webbed foot (rides the pedal circle) -->
    <g>
      <animateMotion dur="2s" repeatCount="indefinite"
        path="M 333 370 A 22 22 0 0 1 355 348 A 22 22 0 0 1 377 370 A 22 22 0 0 1 355 392 A 22 22 0 0 1 333 370"/>
      <path d="M -10 -4 L 12 -6 Q 17 0 12 6 L -10 4 Q -13 0 -10 -4 Z" fill="#F57C00"/>
    </g>

    <!-- wheels -->
    <g transform="translate(250,365)"><g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/></g></g>
    <g transform="translate(470,365)"><g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/></g></g>

    <!-- frame -->
    <g fill="none" stroke-linecap="round">
      <path d="M 355 370 L 329 294 M 355 370 L 449 302 M 331 297 L 447 291 M 250 365 L 331 297 M 250 365 L 355 370"
            stroke="#E53935" stroke-width="7"/>
      <path d="M 447 288 L 458 320" stroke="#C62828" stroke-width="10"/>
      <path d="M 458 320 L 470 365" stroke="#C62828" stroke-width="6"/>
      <path d="M 449 289 L 454 272" stroke="#37474F" stroke-width="6"/>
      <path d="M 440 270 Q 456 260 470 270" stroke="#37474F" stroke-width="5"/>
    </g>
    <circle cx="440" cy="270" r="3.6" fill="#263238"/>
    <circle cx="470" cy="270" r="3.6" fill="#263238"/>
    <circle cx="463" cy="261.5" r="4.5" fill="#FFC107" stroke="#F57F17" stroke-width="1"/>
    <line x1="329" y1="296" x2="330" y2="288" stroke="#757575" stroke-width="5"/>
    <path d="M 308 291 Q 330 278 350 289 Q 345 297 330 297 Q 315 297 308 291 Z" fill="#4E342E"/>

    <!-- chain + rear cog -->
    <path d="M 355 355 L 250 357 M 355 385 L 250 372" stroke="#455A64" stroke-width="3" fill="none"/>
    <circle cx="250" cy="365" r="7.5" fill="#607D8B" stroke="#455A64" stroke-width="1.5"/>

    <!-- near-side crank: chainring, arm, pedal -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 355 370;360 355 370" dur="2s" repeatCount="indefinite"/>
      <circle cx="355" cy="370" r="15" fill="none" stroke="#90A4AE" stroke-width="5"/>
      <circle cx="355" cy="359" r="2.6" fill="#546E7A"/>
      <line x1="355" y1="370" x2="377" y2="370" stroke="#BDBDBD" stroke-width="6" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 377 370;-360 377 370" dur="2s" repeatCount="indefinite"/>
        <rect x="366" y="366" width="22" height="8" rx="3" fill="#263238"/>
      </g>
    </g>
    <circle cx="355" cy="370" r="4" fill="#455A64"/>

    <!-- near leg -->
    <path fill="none" stroke="#FFA726" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
          d="M340 265 L395 304 L377 370">
      <animate attributeName="d" dur="2s" repeatCount="indefinite"
        values="M340 265 L395 304 L377 370;M340 265 L382 319 L371 386;M340 265 L370 326 L355 392;M340 265 L371 325 L339 386;M340 265 L380 320 L333 370;M340 265 L391 310 L339 354;M340 265 L400 297 L355 348;M340 265 L402 293 L371 354;M340 265 L395 304 L377 370"/>
    </path>
    <!-- near webbed foot -->
    <g>
      <animateMotion dur="2s" repeatCount="indefinite"
        path="M 377 370 A 22 22 0 0 1 355 392 A 22 22 0 0 1 333 370 A 22 22 0 0 1 355 348 A 22 22 0 0 1 377 370"/>
      <path d="M -10 -4 L 12 -6 Q 17 0 12 6 L -10 4 Q -13 0 -10 -4 Z" fill="#FFA726"/>
    </g>

    <!-- tail feathers -->
    <path d="M 316 222 L 268 210 L 276 224 L 262 232 L 280 238 L 270 250 L 316 248 Z"
          fill="#F0F4F5" stroke="#CFD8DC" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M 378 222 Q 390 194 400 180" stroke="#CFD8DC" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M 378 222 Q 390 194 400 180" stroke="#FAFAFA" stroke-width="26" fill="none" stroke-linecap="round"/>

    <!-- body -->
    <g transform="rotate(-8 352 240)">
      <ellipse cx="352" cy="240" rx="54" ry="41" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="2"/>
      <path d="M 308 254 Q 352 284 396 248 Q 378 272 350 274 Q 322 272 308 254 Z" fill="#EDEFF1"/>
    </g>

    <!-- beak + pouch (nods gently; base hides under the head) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 420 168;1.8 420 168;0 420 168;-1.2 420 168;0 420 168"
        keyTimes="0;0.28;0.55;0.78;1" dur="4s" repeatCount="indefinite"/>
      <path d="M 418 172 C 424 214 460 238 492 219 C 508 210 521 196 527 184 L 418 172 Z"
            fill="#FFA726" stroke="#FB8C00" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 445 182 Q 452 210 470 221" stroke="#FB8C00" stroke-width="1.5" opacity="0.5" fill="none"/>
      <!-- today's catch -->
      <g opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" values="-4 470 206;4 470 206;-4 470 206"
          dur="1.6s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
        <path d="M 458 207 Q 470 197 484 207 Q 470 217 458 207 Z" fill="#64B5F6" stroke="#1E88E5" stroke-width="1.5"/>
        <path d="M 457 207 L 447 200 L 449 207 L 447 214 Z" fill="#64B5F6" stroke="#1E88E5" stroke-width="1.5"/>
        <circle cx="477" cy="204.5" r="1.6" fill="#0D47A1"/>
      </g>
      <path d="M 416 153 L 526 176 Q 533 180 526 184 L 418 172 Z"
            fill="#FFB300" stroke="#FFA000" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M 436 161 L 474 169" stroke="#FFA000" stroke-width="2" opacity="0.65" stroke-linecap="round"/>
    </g>

    <!-- head -->
    <circle cx="404" cy="166" r="23" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="2"/>
    <g stroke="#FFCC80" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M 391 148 Q 384 138 389 129"/>
      <path d="M 399 144 Q 396 133 403 127"/>
    </g>
    <circle cx="412" cy="159" r="5.5" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1"/>
    <circle cx="413.5" cy="159" r="2.8" fill="#263238"/>
    <circle cx="414.6" cy="157.6" r="1" fill="#FFFFFF"/>
    <rect x="405.5" y="151" width="13" height="0" fill="#FAFAFA">
      <animate attributeName="height" values="0;0;14;0;0" keyTimes="0;0.92;0.95;0.98;1" dur="4.7s" repeatCount="indefinite"/>
    </rect>

    <!-- near wing, gripping the handlebar (subtle flap) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 352 220;-3.2 352 220;0 352 220"
        keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="2s" repeatCount="indefinite"/>
      <path d="M 350 218 C 384 202 428 220 452 258 Q 458 266 450 271 C 424 259 396 252 372 249 C 358 245 344 230 350 218 Z"
            fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 428 245 Q 445 255 452 258 Q 458 266 450 271 Q 437 264 422 254 Z" fill="#37474F"/>
      <path d="M 368 230 Q 398 235 418 248" stroke="#CFD8DC" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 361 240 Q 388 246 404 257" stroke="#CFD8DC" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
</div>

<footer>single file · no JS · pedals, blink, bob &amp; parallax all loop on their own</footer>

</body>
</html>
