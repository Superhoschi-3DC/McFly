<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelican on a bicycle</title>
<style>
:root{--page:#dfeaf2;--sky1:#8ecdf0;--sky2:#eaf7ff;--sun:#ffd24d;--cloud:#ffffff;--hill1:#9cc9a8;--hill2:#6fae86;--tree:#3f8d5a;--trunk:#6b4a2f;--road:#59606b;--verge:#7fbf72;--btn:#1d2b36;--btnbg:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0e1622;--sky1:#0b1430;--sky2:#2b3a63;--sun:#eceac8;--cloud:#3a4872;--hill1:#1d3a4a;--hill2:#17303a;--tree:#14402e;--trunk:#2a1f17;--road:#2a2f38;--verge:#2f5f3d;--btn:#e8eef5;--btnbg:#1b2635}}
:root[data-theme="dark"]{--page:#0e1622;--sky1:#0b1430;--sky2:#2b3a63;--sun:#eceac8;--cloud:#3a4872;--hill1:#1d3a4a;--hill2:#17303a;--tree:#14402e;--trunk:#2a1f17;--road:#2a2f38;--verge:#2f5f3d;--btn:#e8eef5;--btnbg:#1b2635}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:grid;place-content:center;justify-items:center;gap:14px;padding:16px;background:var(--page);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
svg{display:block;width:min(960px,100%);height:auto;border-radius:18px}
button{font:inherit;color:var(--btn);background:var(--btnbg);border:1.5px solid var(--btn);border-radius:999px;padding:7px 20px;cursor:pointer}
button:focus-visible{outline:3px solid #2f6fb3;outline-offset:3px}
.drift{animation:slide 50s linear infinite}
.far{animation:slide 40s linear infinite}
.near{animation:slide2 13.4s linear infinite}
.trees{animation:slide3 3.4s linear infinite}
.sway{transform-origin:458px 119px;animation:sway 2.2s ease-in-out infinite}
.eye{transform-origin:449px 106px;animation:blink 4.5s infinite}
@keyframes slide{to{transform:translateX(-800px)}}
@keyframes slide2{to{transform:translateX(-600px)}}
@keyframes slide3{to{transform:translateX(-400px)}}
@keyframes sway{50%{transform:rotate(3.5deg) scaleY(1.04)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.paused *{animation-play-state:paused}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 500" role="img" aria-label="An animated pelican in a red helmet pedalling a blue bicycle along a road">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/>
  </linearGradient>
  <g id="wheel">
    <circle r="70" fill="none" stroke="#262626" stroke-width="7"/>
    <circle r="63" fill="none" stroke="#9a9a9a" stroke-width="1.5"/>
    <path stroke="#8a8a8a" stroke-width="1.2" d="M-63 0H63M0-63V63M-44.5-44.5L44.5 44.5M-44.5 44.5L44.5-44.5M-58-24L58 24M-58 24L58-24M-24-58L24 58M-24 58L24-58"/>
    <circle r="6" fill="#444"/>
    <circle cx="63" r="4" fill="#ff9a1f"/>
  </g>
  <g id="cloud"><ellipse rx="46" ry="14"/><ellipse cx="-14" cy="-10" rx="22" ry="16"/><ellipse cx="14" cy="-14" rx="26" ry="18"/></g>
  <g id="tree">
    <rect x="-4" y="-34" width="8" height="34" style="fill:var(--trunk)"/>
    <circle cy="-52" r="26" style="fill:var(--tree)"/><circle cx="-14" cy="-40" r="16" style="fill:var(--tree)"/><circle cx="14" cy="-40" r="16" style="fill:var(--tree)"/>
  </g>
</defs>

<rect width="800" height="500" fill="url(#sky)"/>
<circle cx="650" cy="92" r="34" style="fill:var(--sun)"/>
<g class="drift" style="fill:var(--cloud)" opacity=".9">
  <use href="#cloud" x="120" y="70"/><use href="#cloud" x="470" y="125"/>
  <use href="#cloud" x="920" y="70"/><use href="#cloud" x="1270" y="125"/>
</g>
<path id="hillFar" class="far" style="fill:var(--hill1)"/>
<path id="hillNear" class="near" style="fill:var(--hill2)"/>
<g id="trees" class="trees"></g>

<rect y="400" width="800" height="100" style="fill:var(--road)"/>
<rect y="400" width="800" height="8" style="fill:var(--verge)"/>
<line id="dash" x1="-100" x2="900" y1="458" y2="458" stroke="#f1f1f1" stroke-width="5" stroke-dasharray="46 34" opacity=".7"/>
<ellipse cx="400" cy="405" rx="165" ry="7" fill="#000" opacity=".22"/>

<!-- far leg + far crank -->
<line id="crankB" x1="385" y1="335" x2="385" y2="335" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<path id="legB" fill="none" stroke="#c96a14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path id="footB" d="M-5-4L16 3L12 9L-5 6Z" fill="#d8791a" stroke="#7a3f0a" stroke-width="1.5" stroke-linejoin="round"/>

<!-- bicycle -->
<use id="w1" href="#wheel"/>
<use id="w2" href="#wheel"/>
<g fill="none" stroke="#2f6fb3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M290 330L385 335L350 240Z"/>
  <path d="M350 240L472 236M385 335L481 250M467 222L481 252L511 330"/>
  <path d="M350 240L347 222" stroke-width="5"/>
  <path d="M326 220Q350 213 376 220" stroke="#222" stroke-width="9"/>
  <path d="M467 222L462 208M452 206Q472 196 486 210" stroke="#222" stroke-width="5"/>
  <circle cx="385" cy="335" r="13" stroke="#777" stroke-width="3"/>
</g>

<!-- near crank + leg -->
<line id="crankA" x1="385" y1="335" x2="385" y2="335" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<path id="legA" fill="none" stroke="#f08a24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path id="footA" d="M-5-4L16 3L12 9L-5 6Z" fill="#f59a33" stroke="#8a4a0c" stroke-width="1.5" stroke-linejoin="round"/>

<!-- pelican -->
<g id="bird" stroke="#2a2a2a" stroke-linejoin="round" stroke-linecap="round">
  <path d="M298 190Q262 184 236 206Q268 208 302 206Z" fill="#ddd7ca" stroke-width="2.5"/>
  <path d="M298 200Q264 206 244 232Q276 226 304 214Z" fill="#cfc8b9" stroke-width="2.5"/>
  <path d="M372 160C412 156 392 124 432 112" fill="none" stroke-width="28"/>
  <path d="M372 160C412 156 392 124 432 112" fill="none" stroke="#f8f5ee" stroke-width="22"/>
  <ellipse cx="346" cy="182" rx="60" ry="44" transform="rotate(-14 346 182)" fill="#f8f5ee" stroke-width="3"/>
  <g id="head">
    <path class="sway" d="M458 119L573 133Q552 180 476 142Z" fill="#f7c26b" stroke-width="2.5"/>
    <path d="M456 100L576 126Q581 131 573 133L456 119Z" fill="#f4a93c" stroke-width="2.5"/>
    <ellipse cx="440" cy="106" rx="25" ry="21" fill="#f8f5ee" stroke-width="3"/>
    <path d="M416 104Q414 80 440 80Q466 82 464 100Q440 96 416 104Z" fill="#e8453c" stroke-width="2.5"/>
    <path d="M436 81L440 97" stroke="#fff" stroke-width="3" fill="none"/>
    <g class="eye"><circle cx="449" cy="106" r="4.5" fill="#1a1a1a" stroke="none"/><circle cx="450.5" cy="104.5" r="1.5" fill="#fff" stroke="none"/></g>
  </g>
  <path d="M356 158C400 156 446 186 486 204C482 220 438 218 404 204C378 194 352 188 344 174Z" fill="#efe9dc" stroke-width="3"/>
  <path d="M390 190Q420 205 452 208M376 178Q410 196 442 200" fill="none" stroke-width="1.5" opacity=".5"/>
  <ellipse cx="486" cy="208" rx="9" ry="7" fill="#4a4640" stroke-width="2"/>
</g>
</svg>
<button id="toggle" type="button">Pause</button>

<script>
const $ = id => document.getElementById(id);
const rep = (s, n) => s.repeat(n);
$('hillFar').setAttribute('d', 'M0 342' + rep('c100-40 200-40 300 0s150 40 250 0s150-30 250 0', 3) + 'V420H0Z');
$('hillNear').setAttribute('d', 'M0 372' + rep('c80-30 160-30 240 0s120 28 200 0s120-24 160 0', 4) + 'V420H0Z');
let tr = '';
for (let i = 0; i < 3; i++) {
  tr += `<use href="#tree" transform="translate(${i*400+70} 404)"/>`;
  tr += `<use href="#tree" transform="translate(${i*400+290} 404) scale(.75)"/>`;
}
$('trees').innerHTML = tr;

const BB = [385, 335], CR = 30, L1 = 74, L2 = 78, V = 180;
function leg(hx, hy, px, py) {
  let dx = px - hx, dy = py - hy, d = Math.hypot(dx, dy);
  d = Math.min(d, L1 + L2 - 0.01);
  const a = (L1*L1 - L2*L2 + d*d) / (2*d), h = Math.sqrt(Math.max(0, L1*L1 - a*a));
  const ux = dx / d, uy = dy / d;
  return [hx + ux*a + uy*h, hy + uy*a - ux*h];
}
function pedal(ang, hip, crank, legEl, foot) {
  const px = BB[0] + CR*Math.cos(ang), py = BB[1] + CR*Math.sin(ang);
  const ax = px - 4, ay = py - 9, k = leg(hip[0], hip[1], ax, ay);
  $(crank).setAttribute('x2', px); $(crank).setAttribute('y2', py);
  $(legEl).setAttribute('d', `M${hip[0]} ${hip[1]}L${k[0]} ${k[1]}L${ax} ${ay}`);
  $(foot).setAttribute('transform', `translate(${ax} ${ay})`);
}
function draw(t) {
  const a = t * 2.9, wd = (V / 70) * t * 180 / Math.PI;
  $('w1').setAttribute('transform', `translate(290 330) rotate(${wd})`);
  $('w2').setAttribute('transform', `translate(510 330) rotate(${wd})`);
  $('dash').setAttribute('stroke-dashoffset', (V * t) % 80);
  const bob = Math.sin(2*a + 0.6) * 2;
  $('bird').setAttribute('transform', `translate(0 ${bob})`);
  $('head').setAttribute('transform', `rotate(${Math.sin(a) * 1.5} 420 130)`);
  pedal(a, [358, 228 + bob], 'crankA', 'legA', 'footA');
  pedal(a + Math.PI, [350, 230 + bob], 'crankB', 'legB', 'footB');
}

let t = 0, last = 0, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const btn = $('toggle');
function sync() { document.body.classList.toggle('paused', !playing); btn.textContent = playing ? 'Pause' : 'Play'; }
btn.addEventListener('click', () => { playing = !playing; sync(); });
sync();
function frame(now) {
  if (playing) t += Math.min(0.05, (now - last) / 1000);
  last = now;
  draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
<script>
(function cardPreviewFit() {
  const fr = window.frameElement;
  const cardMode =
    new URLSearchParams(window.location.search).get("pelikan-card") === "1" ||
    (fr && fr.classList && fr.classList.contains("pelikan-live"));
  if (!cardMode) return;
  if (fr && fr.id === "pelikan-fs-frame") return;
  const scene = document.getElementById("scene");
  const btn = document.getElementById("toggle");
  if (!scene) return;
  const vb = scene.viewBox && scene.viewBox.baseVal;
  const w = (vb && vb.width > 0) ? vb.width : 800;
  const h = (vb && vb.height > 0) ? vb.height : 500;
  function apply() {
    const wrap = fr && fr.closest(".pelikan-preview-wrap");
    const pad = 2;
    const wrapW = Math.max(
      wrap ? wrap.clientWidth : document.documentElement.clientWidth, 1);
    const wrapH = Math.max(
      wrap ? wrap.clientHeight : document.documentElement.clientHeight, 1);
    document.documentElement.style.cssText =
      "margin:0;padding:0;overflow:hidden;width:" + wrapW + "px;height:" + wrapH + "px;background:transparent;";
    document.body.style.cssText =
      "margin:0;padding:0;overflow:hidden;position:relative;width:" + wrapW + "px;height:" + wrapH + "px;background:transparent;display:block;";
    if (btn) btn.style.display = "none";
    let shell = document.getElementById("pelikan-scene-shell");
    if (!shell) {
      shell = document.createElement("div");
      shell.id = "pelikan-scene-shell";
      shell.style.cssText =
        "position:absolute;left:50%;top:50%;transform-origin:center center;line-height:0;overflow:visible;";
      scene.parentNode.insertBefore(shell, scene);
      shell.appendChild(scene);
    }
    shell.style.width = w + "px";
    shell.style.height = h + "px";
    scene.style.width = "100%";
    scene.style.height = "100%";
    const cover = Math.max((wrapW - pad) / w, (wrapH - pad) / h);
    shell.style.transform = "translate(-50%,-50%) scale(" + cover + ")";
    try { fr.dataset.pelikanCover = cover.toFixed(4); } catch (e) {}
  }
  apply();
  [50, 200, 500, 1200, 2500].forEach(function (t) { setTimeout(apply, t); });
  try {
    const wrap = fr.closest(".pelikan-preview-wrap");
    if (wrap && typeof ResizeObserver !== "undefined") {
      new ResizeObserver(apply).observe(wrap);
    }
  } catch (e) {}
  window.addEventListener("resize", apply);
})();
</script>
</body>
</html>
