<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican on a Bicycle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0f7fa; /* Sky blue */
            background-image: radial-gradient(circle at 50% 30%, #ffffff 0%, #e0f7fa 60%, #b2ebf2 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .scene {
            position: relative;
            width: 600px;
            height: 600px;
        }

        /* Ground */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to bottom, #4caf50, #2e7d32);
            border-radius: 20px 20px 0 0;
            transform: translateY(100%);
        }

        /* Road markings */
        .road-lines {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 20px;
            overflow: hidden;
        }
        
        .line {
            position: absolute;
            width: 40px;
            height: 100%;
            background-color: #f1c40f;
            left: 50%;
            transform: translateX(-50%);
            animation: moveRoad 1s linear infinite;
        }

        @keyframes moveRoad {
            0% { left: 50%; }
            100% { left: -10%; }
        }

        /* The Bicycle Container */
        .bicycle-group {
            position: absolute;
            top: 250px; /* Adjusted for pelican size */
            left: 50px;
            transform-origin: center center;
            /* Movement across the screen */
            animation: rideAcross 4s linear infinite;
        }

        /* Pelican Group (attached to bike) */
        .pelican-group {
            position: absolute;
            top: 30px;
            right: 40px; /* Seat post offset */
            width: 60px;
            height: 80px;
        }

        /* Pedals Animation Logic */
        .wheel {
            transform-origin: center;
            animation: spin 0.6s linear infinite;
        }

        .pedal-group {
            transform-origin: 160px 250px; /* Matches the bottom center of the rear wheel */
            animation: pedalMove 0.6s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pedalMove {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rideAcross {
            0% { left: -100px; }
            100% { left: 100%; }
        }

        /* Sun */
        .sun {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background-color: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 40px #ffeb3b;
            animation: pulseSun 3s ease-in-out infinite;
        }

        @keyframes pulseSun {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px #ffeb3b; }
            50% { transform: scale(1.1); box-shadow: 0 0 60px #ffeb3b; }
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background-color: white;
            border-radius: 50px;
            opacity: 0.9;
        }

        .cloud::after, .cloud::before {
            content: '';
            position: absolute;
            background-color: white;
            border-radius: 50%;
        }

        .c1 { width: 100px; height: 40px; top: 60px; left: 20%; animation: cloudFloat 8s linear infinite; }
        .c1::after { width: 50px; height: 50px; top: -25px; left: 15px; }
        .c1::before { width: 40px; height: 40px; top: -15px; left: 50px; }

        .c2 { width: 80px; height: 30px; top: 120px; left: 70%; animation: cloudFloat 10s linear infinite reverse; }
        .c2::after { width: 40px; height: 40px; top: -20px; left: 10px; }
        .c2::before { width: 30px; height: 30px; top: -10px; left: 35px; }

        @keyframes cloudFloat {
            0% { left: -150px; }
            100% { left: 110%; }
        }
        
        /* Title overlay */
        h1 {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #006064;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.2rem;
            opacity: 0.7;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="scene">
        
        <!-- Background Elements -->
        <div class="sun"></div>
        
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>

        <div class="road-lines">
            <div class="line"></div>
        </div>

        <!-- The Bicycle -->
        <div class="bicycle-group">
            
            <!-- Bike SVG -->
            <svg width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="160" cy="155" rx="100" ry="15" fill="rgba(0,0,0,0.2)" />

                <!-- Rear Wheel -->
                <g class="wheel" style="transform-origin: 80px 110px;">
                    <circle cx="80" cy="110" r="40" stroke="#333" stroke-width="4" fill="none"/>
                    <!-- Spokes -->
                    <g stroke="#666" stroke-width="1">
                        <line x1="80" y1="70" x2="80" y2="150"/>
                        <line x1="40" y1="110" x2="120" y2="110"/>
                        <line x1="49" y1="79" x2="111" y2="141"/>
                        <line x1="111" y1="79" x2="49" y2="141"/>
                        <line x1="60" y1="60" x2="100" y2="160"/>
                        <line x1="100" y1="60" x2="60" y2="160"/>
                    </g>
                    <!-- Hub -->
                    <circle cx="80" cy="110" r="5" fill="#333"/>
                </g>

                <!-- Front Wheel -->
                <g class="wheel" style="transform-origin: 240px 110px;">
                    <circle cx="240" cy="110" r="40" stroke="#333" stroke-width="4" fill="none"/>
                    <!-- Spokes -->
                    <g stroke="#666" stroke-width="1">
                        <line x1="240" y1="70" x2="240" y2="150"/>
                        <line x1="200" y1="110" x2="280" y2="110"/>
                        <line x1="209" y1="79" x2="271" y2="141"/>
                        <line x1="271" y1="79" x2="209" y2="141"/>
                        <line x1="220" y1="60" x2="260" y2="160"/>
                        <line x1="260" y1="60" x2="220" y2="160"/>
                    </g>
                    <!-- Hub -->
                    <circle cx="240" cy="110" r="5" fill="#333"/>
                </g>

                <!-- Frame -->
                <path d="M80,110 L160,150 L240,110 L160,150 L160,80" stroke="#e74c3c" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M160,80 L240,110 L240,90" stroke="#e74c3c" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M160,150 L80,110 L80,130" stroke="#e74c3c" stroke-width="5" fill="none" stroke-linecap="round"/>

                <!-- Pedals and Crank -->
                <g class="pedal-group">
                    <circle cx="160" cy="110" r="8" fill="#333"/>
                    <line x1="160" y1="110" x2="160" y2="130" stroke="#333" stroke-width="4"/>
                    <line x1="160" y1="110" x2="160" y2="90" stroke="#333" stroke-width="4"/>
                    <!-- Pedal plates -->
                    <rect x="150" y="125" width="20" height="6" fill="#555"/>
                    <rect x="150" y="85" width="20" height="6" fill="#555"/>
                </g>

                <!-- Handlebars & Seat -->
                <path d="M220,90 L260,90 L260,60" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="160" y1="80" x2="200" y2="60" stroke="#333" stroke-width="5"/>
                <circle cx="200" cy="60" r="8" fill="#333"/>
                <circle cx="160" cy="80" r="8" fill="#333"/>
                
                <!-- Bell -->
                <circle cx="265" cy="65" r="4" fill="#f1c40f" stroke="#f39c12" stroke-width="1"/>

            </svg>

            <!-- The Pelican -->
            <div class="pelican-group">
                <svg width="80" height="100" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Tail feathers -->
                    <path d="M0,60 Q-10,50 0,40" stroke="#34495e" stroke-width="4" fill="none"/>
                    <path d="M0,60 Q-10,70 0,80" stroke="#34495e" stroke-width="4" fill="none"/>
                    
                    <!-- Body -->
                    <path d="M5,35 Q0,70 10,90 L50,90 L40,30 Z" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
                    
                    <!-- Neck -->
                    <path d="M45,30 Q60,10 65,30 Q70,50 50,50" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>

                    <!-- Head -->
                    <circle cx="70" cy="35" r="18" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
                    
                    <!-- Eye -->
                    <circle cx="78" cy="30" r="4" fill="#333"/>

                    <!-- Beak (The pouch) -->
                    <path d="M82,35 Q100,40 90,60 L82,60 Z" fill="#f1c40f" stroke="#e67e22" stroke-width="2"/>
                    <line x1="82" y1="40" x2="90" y2="40" stroke="#e67e22" stroke-width="1"/>

                    <!-- Wing (Flapping animation) -->
                    <path class="wing" d="M20,50 Q15,80 30,70" fill="#bdc3c7" stroke="#95a5a6" stroke-width="2">
                        <animateTransform attributeName="transform" type="rotate" from="0 40 80" to="20 40 60" dur="0.2s" repeatCount="indefinite" />
                    </path>

                    <!-- Feet (Pedal contact) -->
                    <g transform="translate(45, 95)">
                        <!-- Left foot -->
                        <path class="foot-left" d="M0,0 L0,15 L-5,15 M0,0 L0,15 L5,15 M0,0 L0,15 L10,15" stroke="#e67e22" stroke-width="3" stroke-linecap="round" fill="none"/>
                    </g>

                </svg>
            </div>

        </div>

        <div class="ground"></div>

    </div>

    <h1>Pelican Express</h1>

</body>
</html>
