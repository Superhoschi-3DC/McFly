<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #bceef0;
    font-family: system-ui, sans-serif;
  }
  svg {
    width: min(100vw, 1100px);
    height: auto;
    display: block;
  }
  .cloud { animation: drift 18s linear infinite; }
  .cloud.two { animation-duration: 25s; animation-delay: -12s; }
  .wheel-spokes {
    transform-box: view-box;
    transform-origin: 300px 360px;
    animation: spin 2.3s linear infinite;
  }
  .wheel-spokes.front {
    transform-origin: 580px 360px;
  }
  .crank {
    transform-box: view-box;
    transform-origin: 450px 360px;
    animation: spin 1.1s linear infinite;
  }
  .rider {
    transform-box: view-box;
    transform-origin: 410px 230px;
    animation: bob .55s ease-in-out infinite alternate;
  }
  .leg-back {
    transform-box: view-box;
    transform-origin: 410px 232px;
    animation: pedal 1.1s ease-in-out infinite alternate;
  }
  .leg-front {
    transform-box: view-box;
    transform-origin: 410px 232px;
    animation: pedal 1.1s ease-in-out infinite alternate-reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pedal { to { transform: rotate(24deg); } }
  @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
  @keyframes drift { from { transform: translateX(-180px); } to { transform: translateX(980px); } }
</style>
</head>
<body>
<svg viewBox="0 0 900 500" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals along a sunny seaside path.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a8e7f0"/>
      <stop offset="1" stop-color="#effbdc"/>
    </linearGradient>
    <linearGradient id="bill" x2="0" y2="1">
      <stop stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#ef762e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#sky)"/>
  <circle cx="748" cy="88" r="42" fill="#ffe887"/>
  <g class="cloud" fill="#fff" opacity=".82">
    <ellipse cx="115" cy="105" rx="43" ry="17"/>
    <circle cx="95" cy="95" r="20"/><circle cx="124" cy="88" r="27"/>
    <circle cx="149" cy="101" r="17"/>
  </g>
  <g class="cloud two" fill="#fff" opacity=".7">
    <ellipse cx="420" cy="78" rx="42" ry="14"/>
    <circle cx="400" cy="70" r="18"/><circle cx="427" cy="63" r="23"/>
    <circle cx="451" cy="77" r="15"/>
  </g>

  <path d="M0 322 Q170 290 330 320 T650 316 T900 302 V500 H0Z" fill="#8fd3a0"/>
  <path d="M0 376 Q190 350 380 374 T900 360 V500 H0Z" fill="#50a88b"/>
  <path d="M0 412 H900" stroke="#f6ebc8" stroke-width="54"/>
  <path d="M0 412 H900" stroke="#fff9df" stroke-width="4" stroke-dasharray="32 28" opacity=".85"/>
  <path d="M0 443 H900" stroke="#d5cda9" stroke-width="2" opacity=".55"/>

  <!-- Bicycle wheels -->
  <g fill="none" stroke="#263b46" stroke-width="8">
    <circle cx="300" cy="360" r="76"/>
    <circle cx="580" cy="360" r="76"/>
  </g>
  <g fill="none" stroke="#718b8d" stroke-width="2">
    <circle cx="300" cy="360" r="67"/>
    <circle cx="580" cy="360" r="67"/>
  </g>
  <g class="wheel-spokes" stroke="#789092" stroke-width="2">
    <path d="M300 284V436 M224 360H376 M246 306L354 414 M246 414L354 306"/>
  </g>
  <g class="wheel-spokes front" stroke="#789092" stroke-width="2">
    <path d="M580 284V436 M504 360H656 M526 306L634 414 M526 414L634 306"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#e85e49" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 360 L385 255 L450 360 L300 360"/>
    <path d="M385 255 L500 255 L580 360 L450 360"/>
  </g>
  <g stroke="#263b46" stroke-width="8" stroke-linecap="round">
    <path d="M377 255H408"/>
    <path d="M495 255L505 236"/>
    <path d="M493 236H526"/>
    <path d="M450 360L470 377"/>
  </g>
  <circle cx="450" cy="360" r="11" fill="#263b46"/>

  <!-- Pedals and crank -->
  <g class="crank">
    <path d="M450 360L470 377 M450 360L430 343" stroke="#263b46" stroke-width="6" stroke-linecap="round"/>
    <path d="M459 380H480 M419 336H440" stroke="#263b46" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Pelican's cycling legs -->
  <g fill="none" stroke="#e9893e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <g class="leg-back">
      <path d="M408 228 Q430 268 468 293 L470 377"/>
      <path d="M470 377 Q478 382 489 379"/>
    </g>
    <g class="leg-front">
      <path d="M414 231 Q390 270 428 303 L430 343"/>
      <path d="M430 343 Q420 348 411 342"/>
    </g>
  </g>

  <!-- Pelican -->
  <g class="rider">
    <!-- body -->
    <ellipse cx="405" cy="207" rx="58" ry="43" fill="#fffdf4" stroke="#d8e2dc" stroke-width="3"/>
    <path d="M376 201 Q401 180 435 197 Q423 226 391 238 Q373 225 376 201Z" fill="#eef4ec"/>
    <!-- tail feathers -->
    <path d="M355 202 Q333 190 327 176 Q350 181 365 195" fill="#fffdf4" stroke="#d8e2dc" stroke-width="3"/>
    <!-- neck -->
    <path d="M431 205 Q438 172 454 150 Q462 139 472 143" fill="none" stroke="#fffdf4" stroke-width="20" stroke-linecap="round"/>
    <path d="M431 205 Q438 172 454 150 Q462 139 472 143" fill="none" stroke="#d8e2dc" stroke-width="2" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="466" cy="132" r="25" fill="#fffdf4" stroke="#d8e2dc" stroke-width="3"/>
    <circle cx="474" cy="128" r="3.7" fill="#263b46"/>
    <circle cx="475" cy="127" r="1" fill="#fff"/>
    <!-- long bill and pouch -->
    <path d="M487 137 Q533 137 589 148 Q563 159 519 157 Q499 155 487 145Z" fill="url(#bill)" stroke="#cf642f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M510 153 Q535 159 562 153 Q557 181 535 190 Q519 181 510 153Z" fill="#f28a3f" stroke="#cf642f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M519 160 Q532 168 552 162" fill="none" stroke="#ffc06a" stroke-width="3" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M384 198 Q405 184 432 197 Q421 218 397 224 Q383 218 384 198Z" fill="#f4f5eb" stroke="#d8e2dc" stroke-width="2"/>
    <path d="M397 204 Q412 208 424 201 M398 213 Q411 215 420 209" fill="none" stroke="#d3ddd5" stroke-width="2" stroke-linecap="round"/>
    <!-- reaching wing/arm -->
    <path d="M429 190 Q467 205 501 233 Q520 247 535 246" fill="none" stroke="#fffdf4" stroke-width="13" stroke-linecap="round"/>
    <path d="M429 190 Q467 205 501 233 Q520 247 535 246" fill="none" stroke="#d8e2dc" stroke-width="2" stroke-linecap="round"/>
    <circle cx="536" cy="246" r="7" fill="#f2a45b"/>
  </g>

  <!-- Handlebar grips in front of the wing -->
  <path d="M526 236L540 253 M535 246L548 242" stroke="#263b46" stroke-width="6" stroke-linecap="round"/>
  <!-- small hub highlights -->
  <g fill="#dce8df" stroke="#263b46" stroke-width="3">
    <circle cx="300" cy="360" r="6"/>
    <circle cx="580" cy="360" r="6"/>
  </g>
  <g fill="#5b9b79">
    <path d="M105 344q10-24 19 0q-9-6-19 0M726 338q10-26 19 0q-9-7-19 0"/>
    <path d="M786 349q8-18 16 0q-8-5-16 0M190 334q8-20 16 0q-8-5-16 0"/>
  </g>
</svg>
</body>
</html>
