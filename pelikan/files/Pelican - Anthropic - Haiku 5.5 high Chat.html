<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican on a Bicycle</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f1f5f9;
    padding: 16px;
    box-sizing: border-box;
  }
  svg {
    width: min(100%, 900px);
    height: auto;
    display: block;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
  }

  /* Rider and bike bounce over the road */
  .bounce { animation: bob 0.4s ease-in-out infinite alternate; }
  @keyframes bob {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
  }

  /* Clouds drift across the sky */
  .cloud { animation: drift 28s linear infinite; }
  .cloud.slow { animation-duration: 42s; animation-delay: -18s; }
  @keyframes drift {
    from { transform: translateX(-180px); }
    to   { transform: translateX(980px); }
  }

  /* Dashed centre line scrolls left, so the bike appears to move right */
  .dashes { animation: dash 0.9s linear infinite; }
  @keyframes dash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 70; }
  }

  /* Speed streaks trailing behind the bike */
  .streak { animation: streak 0.6s linear infinite; opacity: 0; }
  .streak.s2 { animation-delay: -0.2s; }
  .streak.s3 { animation-delay: -0.4s; }
  @keyframes streak {
    0%   { transform: translateX(60px); opacity: 0; }
    40%  { opacity: 0.7; }
    100% { transform: translateX(-70px); opacity: 0; }
  }

  /* Respect reduced-motion: freeze CSS animations (SMIL is paused in the script) */
  .still * { animation-play-state: paused !important; }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" role="img" aria-label="An animated pelican riding a red bicycle along a road">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8e3"/>
      <stop offset="1" stop-color="#d4f0fb"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="690" cy="92" r="48" fill="#ffd166" opacity="0.35"/>
  <circle cx="690" cy="92" r="34" fill="#ffd166"/>

  <!-- Clouds -->
  <g class="cloud">
    <ellipse cx="140" cy="90" rx="50" ry="18" fill="#ffffff" opacity="0.92"/>
    <ellipse cx="172" cy="80" rx="34" ry="20" fill="#ffffff" opacity="0.92"/>
  </g>
  <g class="cloud slow">
    <ellipse cx="420" cy="60" rx="42" ry="14" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="446" cy="52" rx="28" ry="16" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Hills -->
  <path d="M0 330 Q150 270 300 320 T600 310 T900 320 L900 420 L0 420 Z" fill="#a8dadc"/>
  <path d="M0 360 Q200 320 400 350 T800 345 L800 420 L0 420 Z" fill="#78c39a"/>

  <!-- Road -->
  <rect x="0" y="416" width="800" height="84" fill="#495057"/>
  <rect x="0" y="412" width="800" height="5" fill="#adb5bd"/>
  <line class="dashes" x1="0" y1="458" x2="800" y2="458" stroke="#f8f9fa" stroke-width="4" stroke-dasharray="40 30"/>

  <!-- Speed streaks -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line class="streak" x1="90" y1="300" x2="150" y2="300"/>
    <line class="streak s2" x1="110" y1="330" x2="190" y2="330"/>
    <line class="streak s3" x1="80" y1="365" x2="140" y2="365"/>
  </g>

  <!-- Bike and rider bounce together -->
  <g class="bounce">

    <!-- Rear wheel -->
    <g transform="translate(250 358)">
      <circle r="58" fill="none" stroke="#212529" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <g stroke="#868e96" stroke-width="1.5">
          <line x1="0" y1="0" x2="58" y2="0"/>
          <line x1="0" y1="0" x2="-58" y2="0"/>
          <line x1="0" y1="0" x2="0" y2="58"/>
          <line x1="0" y1="0" x2="0" y2="-58"/>
          <line x1="0" y1="0" x2="41" y2="41"/>
          <line x1="0" y1="0" x2="-41" y2="-41"/>
          <line x1="0" y1="0" x2="-41" y2="41"/>
          <line x1="0" y1="0" x2="41" y2="-41"/>
        </g>
        <circle cx="46" cy="0" r="4" fill="#e63946"/>
      </g>
      <circle r="6" fill="#343a40"/>
    </g>

    <!-- Front wheel -->
    <g transform="translate(505 358)">
      <circle r="58" fill="none" stroke="#212529" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <g stroke="#868e96" stroke-width="1.5">
          <line x1="0" y1="0" x2="58" y2="0"/>
          <line x1="0" y1="0" x2="-58" y2="0"/>
          <line x1="0" y1="0" x2="0" y2="58"/>
          <line x1="0" y1="0" x2="0" y2="-58"/>
          <line x1="0" y1="0" x2="41" y2="41"/>
          <line x1="0" y1="0" x2="-41" y2="-41"/>
          <line x1="0" y1="0" x2="-41" y2="41"/>
          <line x1="0" y1="0" x2="41" y2="-41"/>
        </g>
        <circle cx="46" cy="0" r="4" fill="#e63946"/>
      </g>
      <circle r="6" fill="#343a40"/>
    </g>

    <!-- Frame -->
    <g stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M250 358 L362 358 L318 262 L250 358"/>
      <path d="M318 262 L468 282"/>
      <path d="M362 358 L468 282"/>
      <path d="M468 282 L505 358"/>
    </g>

    <!-- Seat post, saddle, handlebars -->
    <line x1="318" y1="262" x2="314" y2="244" stroke="#212529" stroke-width="5" stroke-linecap="round"/>
    <path d="M298 246 L340 246" stroke="#212529" stroke-width="8" stroke-linecap="round"/>
    <path d="M468 282 L474 252 L492 246" stroke="#212529" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pedals and crank (feet ride the pedals) -->
    <g transform="translate(362 358)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="14" y2="22" stroke="#212529" stroke-width="5" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="-14" y2="-22" stroke="#212529" stroke-width="5" stroke-linecap="round"/>
        <ellipse cx="14" cy="25" rx="9" ry="4.5" fill="#f4a261" stroke="#e76f51" stroke-width="1.5"/>
        <ellipse cx="-14" cy="-19" rx="9" ry="4.5" fill="#f4a261" stroke="#e76f51" stroke-width="1.5"/>
      </g>
      <circle r="9" fill="#343a40"/>
    </g>

    <!-- Pelican -->
    <g class="rider">
      <!-- Tail -->
      <path d="M276 214 L224 194 L236 234 Z" fill="#dee2e6" stroke="#adb5bd" stroke-width="2" stroke-linejoin="round"/>

      <!-- Neck -->
      <path d="M352 204 Q388 186 396 150 L420 146 Q418 188 380 228 Z" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>

      <!-- Body -->
      <ellipse cx="322" cy="222" rx="58" ry="30" transform="rotate(-18 322 222)" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>

      <!-- Wing (flaps around the shoulder) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8 345 205;10 345 205;-8 345 205" dur="0.5s" repeatCount="indefinite"/>
        <path d="M345 205 C320 170 290 178 262 200 C300 198 318 214 330 232 C340 230 352 224 362 218 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
        <path d="M262 200 C285 205 300 214 306 226 C290 218 275 210 262 200 Z" fill="#343a40"/>
      </g>

      <!-- Head -->
      <ellipse cx="414" cy="146" rx="18" ry="15" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>

      <!-- Bill and pouch -->
      <path d="M424 138 Q458 150 500 176 Q504 184 494 186 Q462 174 428 158 Z" fill="#f29e4c"/>
      <path d="M430 156 Q458 170 490 186 Q470 204 446 186 Q434 176 430 156 Z" fill="#ffc857" stroke="#e09f3e" stroke-width="1.5"/>

      <!-- Eye -->
      <circle cx="422" cy="140" r="3.5" fill="#212529"/>
    </g>
  </g>
</svg>

<script>
  // Pause SMIL animations for visitors who prefer reduced motion.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelector('svg').pauseAnimations();
    document.documentElement.classList.add('still');
  }
</script>
</body>
</html>
