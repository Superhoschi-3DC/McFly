<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1c2c;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  svg {
    width: min(96vw, 1100px);
    height: auto;
    display: block;
    border-radius: 18px;
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
  }
</style>
</head>
<body>
<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pelican riding a bicycle along the coast">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e8"/>
      <stop offset="55%" stop-color="#c9e7f5"/>
      <stop offset="100%" stop-color="#f3e6c8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa0b8"/>
      <stop offset="100%" stop-color="#1e6f86"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d3a2"/>
      <stop offset="100%" stop-color="#c9a66b"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4b14a"/>
      <stop offset="100%" stop-color="#e07a2f"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d27a"/>
      <stop offset="100%" stop-color="#e3a24a"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#d9e0e6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1a3040" flood-opacity=".22"/>
    </filter>
    <clipPath id="scene">
      <rect width="1100" height="620" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <rect width="1100" height="620" fill="url(#sky)"/>

    <circle cx="920" cy="92" r="46" fill="#ffe08a">
      <animate attributeName="cy" values="92;88;92" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="92" r="62" fill="#ffe08a" opacity=".22"/>

    <g opacity=".9">
      <g>
        <ellipse cx="160" cy="110" rx="70" ry="28" fill="#fff"/>
        <ellipse cx="210" cy="110" rx="48" ry="22" fill="#fff"/>
        <ellipse cx="120" cy="118" rx="40" ry="18" fill="#fff"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 1200 8; 0 0" dur="42s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="-80" cy="160" rx="90" ry="30" fill="#fff" opacity=".85"/>
        <ellipse cx="-20" cy="156" rx="55" ry="24" fill="#fff" opacity=".85"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 1280 -6; 0 0" dur="56s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="640" cy="80" rx="50" ry="18" fill="#fff" opacity=".75"/>
        <ellipse cx="680" cy="84" rx="28" ry="14" fill="#fff" opacity=".75"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 900 10; 0 0" dur="38s" repeatCount="indefinite"/>
      </g>
    </g>

    <path d="M0 330 C180 300 280 360 460 330 C640 300 760 370 1100 320 L1100 430 L0 430 Z" fill="url(#sea)" opacity=".85"/>
    <path d="M0 390 Q180 372 360 392 T720 386 T1100 400 L1100 430 L0 430 Z" fill="#2a879c" opacity=".35">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M0 390 Q180 372 360 392 T720 386 T1100 400 L1100 430 L0 430 Z;
                M0 392 Q180 384 360 376 T720 396 T1100 388 L1100 430 L0 430 Z;
                M0 390 Q180 372 360 392 T720 386 T1100 400 L1100 430 L0 430 Z"/>
    </path>

    <rect y="428" width="1100" height="192" fill="url(#sand)"/>
    <path d="M0 428 C220 448 420 418 640 442 C820 462 960 430 1100 448 L1100 620 L0 620 Z" fill="#d7bc86" opacity=".55"/>

    <g opacity=".55">
      <g>
        <ellipse cx="80" cy="508" rx="26" ry="8" fill="#b08950"/>
        <ellipse cx="210" cy="536" rx="18" ry="6" fill="#b08950"/>
        <ellipse cx="340" cy="500" rx="30" ry="9" fill="#c19a5b"/>
        <ellipse cx="490" cy="548" rx="22" ry="7" fill="#b08950"/>
        <ellipse cx="640" cy="512" rx="28" ry="8" fill="#c19a5b"/>
        <ellipse cx="790" cy="540" rx="20" ry="6" fill="#b08950"/>
        <ellipse cx="940" cy="504" rx="32" ry="9" fill="#c19a5b"/>
        <ellipse cx="1080" cy="532" rx="24" ry="7" fill="#b08950"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -220 0; 0 0" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>

    <g stroke="#8a6a3a" stroke-width="3" fill="none" opacity=".35">
      <path d="M0 470 C90 458 140 482 230 470 C320 458 370 486 470 472 C560 458 620 488 720 470 C820 452 880 490 980 472 C1040 462 1070 478 1100 470">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="M0 470 C90 458 140 482 230 470 C320 458 370 486 470 472 C560 458 620 488 720 470 C820 452 880 490 980 472 C1040 462 1070 478 1100 470;
                  M0 470 C90 482 140 458 230 472 C320 486 370 458 470 470 C560 486 620 454 720 472 C820 488 880 452 980 470 C1040 478 1070 462 1100 470;
                  M0 470 C90 458 140 482 230 470 C320 458 370 486 470 472 C560 458 620 488 720 470 C820 452 880 490 980 472 C1040 462 1070 478 1100 470"/>
      </path>
    </g>

    <g opacity=".7">
      <g transform="translate(70,390)">
        <rect x="-6" y="0" width="12" height="48" fill="#6b8f4e"/>
        <ellipse cx="0" cy="-8" rx="18" ry="22" fill="#4f7a3a"/>
        <ellipse cx="-12" cy="6" rx="10" ry="14" fill="#5e8b45"/>
      </g>
      <g transform="translate(980,378)">
        <rect x="-7" y="8" width="14" height="52" fill="#6b8f4e"/>
        <ellipse cx="0" cy="0" rx="22" ry="26" fill="#4f7a3a"/>
        <ellipse cx="14" cy="14" rx="12" ry="16" fill="#5e8b45"/>
      </g>
    </g>

    <g filter="url(#soft)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="70 0; 760 0; 70 0" dur="9.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0; 0 -5; 0 0" dur=".55s" repeatCount="indefinite"/>

          <g transform="translate(250,455)">
            <ellipse cx="0" cy="18" rx="78" ry="10" fill="#7a5a32" opacity=".28"/>
            <g>
              <g transform="translate(-92,0)">
                <circle r="42" fill="none" stroke="#2b3138" stroke-width="7"/>
                <circle r="36" fill="none" stroke="#8aa0b0" stroke-width="2" opacity=".5"/>
                <circle r="6" fill="#2b3138"/>
                <g stroke="#2b3138" stroke-width="2.4">
                  <line x1="0" y1="-36" x2="0" y2="36"/>
                  <line x1="-36" y1="0" x2="36" y2="0"/>
                  <line x1="-25" y1="-25" x2="25" y2="25"/>
                  <line x1="-25" y1="25" x2="25" y2="-25"/>
                  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".7s" repeatCount="indefinite"/>
                </g>
                <circle r="42" fill="none" stroke="#c9d4dc" stroke-width="3" stroke-dasharray="8 10">
                  <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.1s" repeatCount="indefinite"/>
                </circle>
              </g>
              <g transform="translate(92,0)">
                <circle r="42" fill="none" stroke="#2b3138" stroke-width="7"/>
                <circle r="36" fill="none" stroke="#8aa0b0" stroke-width="2" opacity=".5"/>
                <circle r="6" fill="#2b3138"/>
                <g stroke="#2b3138" stroke-width="2.4">
                  <line x1="0" y1="-36" x2="0" y2="36"/>
                  <line x1="-36" y1="0" x2="36" y2="0"/>
                  <line x1="-25" y1="-25" x2="25" y2="25"/>
                  <line x1="-25" y1="25" x2="25" y2="-25"/>
                  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".7s" repeatCount="indefinite"/>
                </g>
                <circle r="42" fill="none" stroke="#c9d4dc" stroke-width="3" stroke-dasharray="8 10">
                  <animateTransform attributeName="transform" type="rotate" from="20" to="-340" dur="1.1s" repeatCount="indefinite"/>
                </circle>
              </g>
            </g>

            <g fill="none" stroke="#2b3138" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M-92 0 L-18 -8 L70 -46"/>
              <path d="M-18 -8 L18 0 L92 0"/>
              <path d="M18 0 L-8 -52"/>
              <path d="M-8 -52 L18 -78"/>
              <path d="M18 -78 L48 -78"/>
              <path d="M-8 -52 L-38 -78"/>
            </g>
            <path d="M-42 -82 q-18 -8 -28 4" fill="none" stroke="#2b3138" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="-8" cy="-58" rx="16" ry="7" fill="#6b4a2a" transform="rotate(-18 -8 -58)"/>
            <circle cx="18" cy="0" r="10" fill="#2b3138"/>

            <g transform="translate(18,0)">
              <g>
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".7s" repeatCount="indefinite"/>
                <line x1="0" y1="0" x2="0" y2="28" stroke="#2b3138" stroke-width="5" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="0" y2="-28" stroke="#2b3138" stroke-width="5" stroke-linecap="round"/>
                <rect x="-9" y="24" width="18" height="6" rx="2" fill="#c45c26"/>
                <rect x="-9" y="-30" width="18" height="6" rx="2" fill="#c45c26"/>
              </g>
            </g>

            <path d="M18 0 C8 -6 -40 8 -70 4" fill="none" stroke="#3a434c" stroke-width="3" stroke-dasharray="7 5">
              <animate attributeName="stroke-dashoffset" values="0;24" dur=".7s" repeatCount="indefinite"/>
            </path>
            <circle cx="-18" cy="-8" r="12" fill="none" stroke="#2b3138" stroke-width="4"/>

            <g transform="translate(-8,-58)">
              <g>
                <animateTransform attributeName="transform" type="rotate" values="-4;3;-4" dur=".55s" repeatCount="indefinite"/>

                <path d="M8 -6 C40 -28 78 -18 92 10 C70 28 28 36 4 18 Z" fill="#9fb0bd">
                  <animate attributeName="d" dur="1.1s" repeatCount="indefinite"
                    values="M8 -6 C40 -28 78 -18 92 10 C70 28 28 36 4 18 Z;
                            M8 -6 C46 -48 96 -30 108 -2 C82 18 30 30 4 18 Z;
                            M8 -6 C40 -28 78 -18 92 10 C70 28 28 36 4 18 Z"/>
                </path>
                <path d="M18 -2 C42 -18 68 -8 78 8" fill="none" stroke="#7e91a0" stroke-width="2"/>

                <ellipse cx="10" cy="8" rx="46" ry="28" fill="url(#body)"/>
                <ellipse cx="22" cy="16" rx="30" ry="16" fill="#cfd8df" opacity=".55"/>

                <path d="M-8 10 C-22 38 -8 58 18 42" fill="none" stroke="#f2f4f6" stroke-width="10" stroke-linecap="round"/>
                <g>
                  <animateTransform attributeName="transform" type="rotate" values="8 18 0; 28 18 0; 8 18 0" dur=".7s" repeatCount="indefinite"/>
                  <path d="M18 0 C8 22 22 40 40 34" fill="none" stroke="#f2f4f6" stroke-width="9" stroke-linecap="round"/>
                  <path d="M40 34 L52 38" stroke="#e07a2f" stroke-width="6" stroke-linecap="round"/>
                  <path d="M50 32 L62 30 M50 38 L62 42" stroke="#e07a2f" stroke-width="3" stroke-linecap="round"/>
                </g>

                <path d="M-30 4 C-58 -28 -48 -70 -18 -78 C8 -86 22 -64 18 -40 C14 -18 2 8 -30 4 Z" fill="url(#body)"/>
                <path d="M-22 -20 C-38 -48 -20 -72 2 -70" fill="none" stroke="#c5d0d8" stroke-width="3"/>

                <g transform="translate(-16,-72)">
                  <animateTransform attributeName="transform" additive="sum" type="rotate" values="-6;8;-6" dur="1.4s" repeatCount="indefinite"/>
                  <ellipse cx="8" cy="6" rx="16" ry="13" fill="url(#body)"/>
                  <path d="M12 8 C48 18 78 8 96 -6 C88 22 48 38 14 22 Z" fill="url(#pouch)"/>
                  <path d="M10 2 L102 -14" fill="none" stroke="url(#beak)" stroke-width="10" stroke-linecap="round"/>
                  <path d="M96 -18 L108 -22" stroke="#d46520" stroke-width="4" stroke-linecap="round"/>
                  <circle cx="4" cy="0" r="3.2" fill="#1d2430"/>
                  <circle cx="3.2" cy="-0.8" r="1.1" fill="#fff"/>
                  <circle cx="-6" cy="8" r="3" fill="#f4c4b0" opacity=".7"/>
                </g>

                <g fill="#3d4a55" opacity=".9">
                  <path d="M38 8 q18 -16 8 -28">
                    <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
                      values="M38 8 q18 -16 8 -28;
                              M38 8 q12 -10 4 -22;
                              M38 8 q18 -16 8 -28"/>
                  </path>
                </g>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <g fill="#fff" opacity=".55">
      <circle cx="180" cy="560" r="3">
        <animate attributeName="cx" values="180; -20" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="560; 548; 560" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".0;.55;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="572" r="2.4">
        <animate attributeName="cx" values="420; 80" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.5;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
</body>
</html>
